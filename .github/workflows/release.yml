name: Build and publish alpha release

on:
  push:
    tags:
      - "v0.0.1-alpha"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ActionRecorder.exe dist/
          Copy-Item README.md dist/
          Copy-Item sample_log.txt dist/
          Copy-Item CMakeLists.txt dist/
          Copy-Item release_notes.md dist/
          Compress-Archive -Path dist/* -DestinationPath ActionRecorder-alpha-0.0.1-x64.zip -Force

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.0.1-alpha `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Alpha 0.0.1 — First Test Release" `
            --prerelease `
            --notes-file release_notes.md `
            ActionRecorder-alpha-0.0.1-x64.zip `
            dist/ActionRecorder.exe `
            dist/README.md `
            dist/sample_log.txt `
            dist/CMakeLists.txt
